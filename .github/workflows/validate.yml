name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      # the card needs the frontend integration, whose UI package the test harness does not ship
      - run: pip install "$(python -c "import json,homeassistant.components.frontend as f,os;print([r for r in json.load(open(os.path.join(os.path.dirname(f.__file__),'manifest.json')))['requirements'] if 'frontend' in r][0])")"
      - run: pytest -q
